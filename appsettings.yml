Log:
  Level: Trace
Bgp:
  Asn: 65530
  Id: 127.0.0.1
  Listen:
      Ip: 0.0.0.0
      Port: 8179
  Peers:
    - Asn: 65530
      Address:
        Ip: 192.168.151.44
        Port: 179
      # Optional TCP-MD5 session key (RFC 2385/5925). Must match the peer
      # router's BGP authentication key; omit or leave empty for no auth.
      # Keep this file mode-restricted when set (e.g. chmod 600).
      #AuthPassword: <tcp-md5-session-key>
Dns:
  Listen:
    Ip: 0.0.0.0
    Port: 5354
  Resolvers:
    - Ip: 77.88.8.8
      Port: 53
    - Ip: 77.88.8.1
      Port: 53
  Cache:
    MinTtl: 10
    MaxEntries: 5000
  Timeout: 5s
  List:
    File: sample\my.lst
    Resolvers:
      - Ip: 1.1.1.1
        Port: 53
      - Ip: 8.8.8.8
        Port: 53
